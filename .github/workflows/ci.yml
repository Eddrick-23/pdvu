name: Cross-Platform CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
          - os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve pinned MuPDF commit
        id: mupdf-commit
        run:
          echo "sha=$(git rev-parse HEAD:external/mupdf)" >>"$GITHUB_OUTPUT"

      - name: Cache MuPDF checkout
        id: cache-mupdf-checkout
        uses: actions/cache@v6
        with:
          path: |
            external/mupdf
            .git/modules/external/mupdf
          key: ${{ matrix.os }}-mupdf-checkout-${{ steps.mupdf-commit.outputs.sha }}

      - name: Fetch MuPDF submodule only
        if: steps.cache-mupdf-checkout.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 --recursive external/mupdf

      # Cache mupdf builds since they take a long time
      - name: Cache MuPDF Build
        id: cache-mupdf
        uses: actions/cache@v6
        with:
          # Only cache the specific folder where the .a files and headers are saved
          path: external/mupdf/build/release
          # key by os to prevent mixing binaries
          key: ${{ matrix.os }}-mupdf-${{ hashFiles('external/mupdf/Makefile') }}

      - name: Build MuPDF Headless
        # Only runs if the cache was not found
        if: steps.cache-mupdf.outputs.cache-hit != 'true'
        run: |
          cd external/mupdf
          make HAVE_X11=no HAVE_GLUT=no build=release libs -j4

      - name: Fix Homebrew Tap Trust (macOS)
        if: matrix.os == 'macos-latest'
        run: brew untap aws/tap || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build and Test
        run: |
          cmake --build build
          cd build && ctest --output-on-failure
